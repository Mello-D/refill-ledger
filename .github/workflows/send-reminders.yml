name: Send refill reminder emails

on:
  schedule:
    # Runs daily at 20:00 UTC, which is 6:00am in Brisbane/AEST (UTC+10,
    # Queensland doesn't observe daylight saving, so this offset is constant
    # year-round). If you ever want a different local time, convert your
    # target time to UTC and adjust the hour below.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          HOUSEHOLD_CODE: ${{ secrets.HOUSEHOLD_CODE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
